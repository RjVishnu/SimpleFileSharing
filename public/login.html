<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – File Server</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="login-page">
<form id="form" class="login-card">
  <span class="logo" data-brand-logo style="align-self:flex-start;width:44px;height:44px">📂</span>
  <h1 data-brand-name>File Server</h1>
  <p>Enter the password to continue.</p>
  <input id="password" type="password" placeholder="Password" autofocus required>
  <button class="btn primary" type="submit">Sign in</button>
  <p id="error" class="error"></p>
</form>
<script src="/brand.js"></script>
<script src="/login.js"></script>
</body>
</html>
